<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#173b73"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="icon"
        href="icon-192.png"
    >

    <title>
        Offline | GovLearn
    </title>


    <meta
        name="theme-color"
        content="#173b73"
    >


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 25px;

            background: #f5f7fb;

            color: #27364b;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        .offline-card {
            width: 100%;
            max-width: 600px;

            padding: 45px;

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 18px;

            box-shadow:
                0 18px 45px
                rgba(
                    15,
                    35,
                    70,
                    0.08
                );

            text-align: center;
        }


        .offline-icon {
            margin-bottom: 15px;

            font-size: 55px;
        }


        h1 {
            margin-bottom: 10px;

            color: #173b73;
        }


        p {
            margin-bottom: 25px;

            color: #667085;

            line-height: 1.6;
        }


        .actions {
            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;
        }


        a,
        button {
            min-height: 46px;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 11px 20px;

            border-radius: 8px;

            font-weight: bold;

            text-decoration: none;

            cursor: pointer;
        }


        .primary {
            background: #173b73;

            border: 2px solid #173b73;

            color: white;
        }


        .secondary {
            background: white;

            border: 2px solid #173b73;

            color: #173b73;
        }


        .offline-note {
            margin-top: 25px;

            margin-bottom: 0;

            color: #94a3b8;

            font-size: 12px;
        }


        @media (
            max-width: 550px
        ) {

            .offline-card {
                padding: 30px 20px;
            }


            .actions {
                flex-direction: column;
            }


            .actions a,
            .actions button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <main class="offline-card">


        <div class="offline-icon">
            📘
        </div>


        <h1>
            You're Offline
        </h1>


        <p>

            GovLearn cannot reach the network right now.

            Pages that you have already visited or that were
            saved for offline use may still be available.

        </p>


        <div class="actions">


            <button
                class="primary"
                type="button"
                onclick="location.reload()"
            >
                Try Again
            </button>


            <a
                class="secondary"
                href="index.html"
            >
                Go to GovLearn
            </a>


        </div>


        <p class="offline-note">

            Your saved learning progress remains stored
            on this browser unless the site's browser
            data is cleared.

        </p>


    </main>

    <script src="pwa.js"></script>

    <script src="site-ui.js"></script>
    
</body>

</html>
